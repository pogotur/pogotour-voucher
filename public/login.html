<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POGO LINES – Autentificare</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Outfit',sans-serif;
  background:linear-gradient(135deg,#0f2040 0%,#1e3a6e 60%,#1a4a8a 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
}
.card{
  background:white;border-radius:16px;
  padding:40px 36px;width:100%;max-width:380px;
  box-shadow:0 24px 80px #00000040;
  text-align:center;
}
.logo{height:56px;object-fit:contain;margin-bottom:24px;}
h1{font-size:1.4rem;font-weight:800;color:#1e3a6e;margin-bottom:6px;}
p{font-size:.85rem;color:#6b7a99;margin-bottom:28px;}
label{display:block;text-align:left;font-size:.78rem;font-weight:600;color:#374151;margin-bottom:5px;}
input[type=password]{
  width:100%;border:1.5px solid #d1dae8;border-radius:8px;
  padding:12px 14px;font-family:'Outfit',sans-serif;font-size:.95rem;
  outline:none;transition:border-color .2s,box-shadow .2s;margin-bottom:16px;
}
input[type=password]:focus{border-color:#1e3a6e;box-shadow:0 0 0 3px #1e3a6e18;}
.btn{
  width:100%;padding:13px;background:#f5a800;color:#0f2040;
  border:none;border-radius:8px;font-family:'Outfit',sans-serif;
  font-size:.95rem;font-weight:800;cursor:pointer;transition:background .2s;
}
.btn:hover{background:#e09700;}
.err{color:#dc2626;font-size:.82rem;margin-top:10px;display:none;}
.footer{margin-top:24px;font-size:.75rem;color:#9ca3af;}
</style>
</head>
<body>
<div class="card">
  <img src="/logo.png" alt="POGO LINES" class="logo" onerror="this.style.display='none'">
  <h1>POGO LINES</h1>
  <p>Sistem Vouchere Transfer Aeroport<br>Autentifică-te pentru a continua.</p>
  <label>Parolă de acces</label>
  <input type="password" id="pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
  <button class="btn" onclick="login()">Intră în aplicație →</button>
  <div class="err" id="err">Parolă incorectă. Încearcă din nou.</div>
  <div class="footer">POGO LINES © 2024 · Uz intern</div>
</div>
<script>
async function login() {
  const pass = document.getElementById('pass').value;
  if (!pass) return;
  const res = await fetch('/api/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({password: pass})
  });
  if (res.ok) {
    window.location.href = '/';
  } else {
    document.getElementById('err').style.display = 'block';
    document.getElementById('pass').value = '';
    document.getElementById('pass').focus();
  }
}
</script>
</body>
</html>
